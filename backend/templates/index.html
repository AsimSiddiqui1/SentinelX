<!DOCTYPE html>
<html>

<head>
    <title>SentinelX Dashboard</title>

    <style>

body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
    margin: 30px;
}

h1, h2, h3 {
    color: white;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

.card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
    border: 1px solid #334155;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: #334155;
    color: white;
}

td {
    background: #1e293b;
}

th, td {
    border: 1px solid #475569;
    padding: 12px;
    text-align: left;
}

.critical {
    background: #dc2626;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
}

.high {
    background: #ea580c;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
}

.medium {
    background: #ca8a04;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
}

.low {
    background: #16a34a;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
}

.stats-container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.stat-card {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 180px;
    text-align: center;
    border: 1px solid #334155;
}

.stat-card h3 {
    margin: 0;
    color: #94a3b8;
}

.stat-card p {
    font-size: 28px;
    font-weight: bold;
    margin-top: 10px;
}

</style>
    
</head>

<body>

    <h1>🛡️ SentinelX Dashboard</h1>

    <button onclick="loadIncident()">
        Generate Incident
    </button>

    <div class="card">

        <h2>Incident Details</h2>

        <p><b>Incident ID:</b> <span id="incident">-</span></p>

        <p><b>Attack:</b> <span id="attack">-</span></p>

        <p><b>Severity:</b> <span id="severity">-</span></p>

        <p><b>MITRE:</b> <span id="mitre">-</span></p>

        <p><b>Risk Score:</b> <span id="risk">-</span></p>

        <p><b>Target Asset:</b> <span id="target">-</span></p>

        <h3>Generated Logs</h3>
        <ul id="logs"></ul>

        <h3>Incident Timeline</h3>
        <ul id="timeline"></ul>

    </div>

    <div class="card">

        <h2>Incident History</h2>

        <table>

            <thead>

                <tr>
                    <th>Incident ID</th>
                    <th>Attack</th>
                    <th>Severity</th>
                    <th>Asset</th>
                </tr>

            </thead>

            <tbody id="history-table">

            </tbody>

        </table>

    </div>

<script>

async function loadIncident() {

    const response =
        await fetch("/incident");

    const data =
        await response.json();

    document.getElementById("incident").textContent =
        data.incident_id;

    document.getElementById("attack").textContent =
        data.attack;

    document.getElementById("mitre").textContent =
        data.mitre;

    document.getElementById("risk").textContent =
        data.risk_score;

    document.getElementById("target").textContent =
        data.target_asset;

    const severityElement =
        document.getElementById("severity");

    severityElement.textContent =
        data.severity;

    severityElement.className =
        data.severity.toLowerCase();

    let logsHTML = "";

    data.logs.forEach(log => {

        logsHTML += `<li>${log}</li>`;

    });

    document.getElementById("logs").innerHTML =
        logsHTML;

    let timelineHTML = "";

    data.timeline.forEach(event => {

        timelineHTML += `<li>${event}</li>`;

    });

    document.getElementById("timeline").innerHTML =
        timelineHTML;

    loadHistory();
}

async function loadHistory() {

    const response =
        await fetch("/history");

    const data =
        await response.json();

    let html = "";

    data.forEach(item => {

        html += `
        <tr>
            <td>${item.incident_id}</td>
            <td>${item.attack}</td>
            <td>${item.severity}</td>
            <td>${item.asset}</td>
        </tr>
        `;

    });

    document.getElementById(
        "history-table"
    ).innerHTML = html;
}

window.onload = loadHistory;

</script>

</body>
</html>
