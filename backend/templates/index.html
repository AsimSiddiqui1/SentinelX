<!DOCTYPE html>
<html>

<head>
    <title>SentinelX Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .card {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .critical {
            color: red;
            font-weight: bold;
        }

        .high {
            color: orange;
            font-weight: bold;
        }

        .medium {
            color: goldenrod;
            font-weight: bold;
        }

        .low {
            color: green;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th {
            padding: 10px;
            background: #f2f2f2;
        }

        td {
            padding: 10px;
        }

    </style>

</head>

<body>

    <h1>🛡️ SentinelX Dashboard</h1>

    <button onclick="loadIncident()">
        Generate Incident
    </button>

    <div class="card">

        <h2>Incident Details</h2>

        <p><b>Incident ID:</b> <span id="incident">-</span></p>

        <p><b>Attack:</b> <span id="attack">-</span></p>

        <p><b>Severity:</b> <span id="severity">-</span></p>

        <p><b>MITRE:</b> <span id="mitre">-</span></p>

        <p><b>Risk Score:</b> <span id="risk">-</span></p>

        <p><b>Target Asset:</b> <span id="target">-</span></p>

        <h3>Generated Logs</h3>
        <ul id="logs"></ul>

        <h3>Incident Timeline</h3>
        <ul id="timeline"></ul>

    </div>

    <div class="card">

        <h2>Incident History</h2>

        <table>

            <thead>

                <tr>
                    <th>Incident ID</th>
                    <th>Attack</th>
                    <th>Severity</th>
                    <th>Asset</th>
                </tr>

            </thead>

            <tbody id="history-table">

            </tbody>

        </table>

    </div>

<script>

async function loadIncident() {

    const response =
        await fetch("/incident");

    const data =
        await response.json();

    document.getElementById("incident").textContent =
        data.incident_id;

    document.getElementById("attack").textContent =
        data.attack;

    document.getElementById("mitre").textContent =
        data.mitre;

    document.getElementById("risk").textContent =
        data.risk_score;

    document.getElementById("target").textContent =
        data.target_asset;

    const severityElement =
        document.getElementById("severity");

    severityElement.textContent =
        data.severity;

    severityElement.className =
        data.severity.toLowerCase();

    let logsHTML = "";

    data.logs.forEach(log => {

        logsHTML += `<li>${log}</li>`;

    });

    document.getElementById("logs").innerHTML =
        logsHTML;

    let timelineHTML = "";

    data.timeline.forEach(event => {

        timelineHTML += `<li>${event}</li>`;

    });

    document.getElementById("timeline").innerHTML =
        timelineHTML;

    loadHistory();
}

async function loadHistory() {

    const response =
        await fetch("/history");

    const data =
        await response.json();

    let html = "";

    data.forEach(item => {

        html += `
        <tr>
            <td>${item.incident_id}</td>
            <td>${item.attack}</td>
            <td>${item.severity}</td>
            <td>${item.asset}</td>
        </tr>
        `;

    });

    document.getElementById(
        "history-table"
    ).innerHTML = html;
}

window.onload = loadHistory;

</script>

</body>
</html>
